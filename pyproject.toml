[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aether-quant"
version = "0.1.0"
description = "Probabilistic option-surface learning, constrained price projection and scenario hedge optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.4,<2", "plotly>=5.24,<7"]
[project.optional-dependencies]
preview = ["matplotlib>=3.7,<4"]
[project.scripts]
aether-quant = "aether_quant.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
